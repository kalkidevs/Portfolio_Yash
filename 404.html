<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Yash Kushwaha</title>
  <meta name="theme-color" content="#121212">
  <link rel="shortcut icon" href="./assets/images/favicon.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: hsl(0, 0%, 7%);
      color: hsl(0, 0%, 84%);
      font-family: 'Poppins', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 480px; }
    .error-code {
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 700;
      background: linear-gradient(135deg, hsl(45, 100%, 71%), hsl(36, 100%, 69%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: hsl(0, 0%, 98%);
    }
    p {
      font-size: 0.9rem;
      color: hsl(0, 0%, 60%);
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 32px;
      background: linear-gradient(135deg, hsl(45, 100%, 71%), hsl(45, 100%, 60%));
      color: hsl(0, 0%, 7%);
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-decoration: none;
      border-radius: 14px;
      transition: all 0.35s ease;
    }
    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px hsla(45, 100%, 71%, 0.3);
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 1.5rem;
      border: 3px solid hsl(0, 0%, 25%);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="./assets/images/my-avatar.png" alt="Yash Kushwaha" class="avatar">
    <div class="error-code">404</div>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back to the portfolio.</p>
    <a href="/" class="home-btn">← Back to Portfolio</a>
  </div>
</body>
</html>
